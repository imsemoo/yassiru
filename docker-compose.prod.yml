services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yassiru-app
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      - mysql
      - redis
    networks:
      - yassiru

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yassiru-queue
    restart: unless-stopped
    env_file: .env.production
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      - mysql
      - redis
    networks:
      - yassiru

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yassiru-scheduler
    restart: unless-stopped
    env_file: .env.production
    command: >
      sh -c "while true; do
        php artisan schedule:run --no-interaction >> /var/www/storage/logs/scheduler.log 2>&1;
        sleep 60;
      done"
    volumes:
      - app-storage:/var/www/storage
    depends_on:
      - mysql
      - redis
    networks:
      - yassiru

  nginx:
    image: nginx:alpine
    container_name: yassiru-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - app
    networks:
      - yassiru

  certbot:
    image: certbot/certbot
    container_name: yassiru-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - .:/var/www
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - yassiru

  mysql:
    image: mysql:8.0
    container_name: yassiru-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-yassiru}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-yassiru}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - yassiru

  redis:
    image: redis:alpine
    container_name: yassiru-redis
    restart: unless-stopped
    networks:
      - yassiru

volumes:
  mysql-data:
  app-storage:
  certbot-etc:
  certbot-var:

networks:
  yassiru:
    driver: bridge
