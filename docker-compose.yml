services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yassiru-app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    depends_on:
      - mysql
      - redis
    networks:
      - yassiru

  nginx:
    image: nginx:alpine
    container_name: yassiru-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - yassiru

  mysql:
    image: mysql:8.0
    container_name: yassiru-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-yassiru}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-yassiru}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - yassiru

  redis:
    image: redis:alpine
    container_name: yassiru-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - yassiru

volumes:
  mysql-data:

networks:
  yassiru:
    driver: bridge
